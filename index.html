<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>会员商城 - 靠谱低价</title>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #1C1C1E;
            --text-secondary: #8E8E93;
            --accent: #34C759;
            --price: #FF3B30;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1C1C1E;
                --text: #FFFFFF;
                --text-secondary: #8E8E93;
            }
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        /* Header */
        header { position: sticky; top: 0; z-index: 100; background: rgba(242,242,247,0.85); backdrop-filter: blur(20px); padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); border-bottom: 0.5px solid var(--text-secondary); }
        @media (prefers-color-scheme: dark) { header { background: rgba(0,0,0,0.85); border-bottom-color: #38383A; } }
        .search-box { width: 100%; padding: 10px 16px; border-radius: 12px; border: none; background: rgba(142,142,147,0.15); color: var(--text); font-size: 16px; outline: none; }
        
        /* Tabs */
        .tabs { display: flex; overflow-x: auto; padding: 12px 16px; gap: 12px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 6px 16px; border-radius: 20px; background: var(--card); font-size: 14px; font-weight: 500; white-space: nowrap; border: 1px solid rgba(142,142,147,0.2); transition: 0.2s; cursor: pointer; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 12px; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); max-width: 800px; margin: 0 auto; } }
        @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); max-width: 1000px; } }

        .card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; height: 100%; position: relative; overflow: hidden; }
        .cat-tag { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(0,122,255,0.1); color: var(--primary); align-self: flex-start; margin-bottom: 8px; }
        .name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; flex-grow: 1; }
        .bottom { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 18px; color: var(--price); font-weight: bold; }
        .price span { font-size: 12px; font-weight: normal; }
        .buy-btn { padding: 8px 14px; border-radius: 20px; background: var(--primary); color: white; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
        .buy-btn:active { opacity: 0.8; transform: scale(0.95); }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; backdrop-filter: blur(10px); }
        .modal { background: var(--card); width: 100%; max-width: 320px; border-radius: 20px; padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal h3 { margin: 0 0 16px; font-size: 18px; }
        .qr-placeholder { width: 180px; height: 180px; background: #E5E5EA; border-radius: 12px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 12px; }
        .order-text { background: rgba(142,142,147,0.15); padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; word-break: break-all; cursor: pointer; user-select: all; }
        .copy-hint { font-size: 11px; color: var(--text-secondary); margin-bottom: 12px; }
        .close-modal { margin-top: 8px; background: transparent; border: 1px solid var(--text-secondary); color: var(--text); padding: 8px 24px; border-radius: 20px; font-size: 14px; cursor: pointer; }
        
        .footer { text-align: center; padding: 24px; font-size: 12px; color: var(--text-secondary); }
    </style>
</head>
<body>

<header>
    <h2 style="margin: 0 0 12px; font-size: 20px;">⚡ 会员商城</h2>
    <input type="text" class="search-box" id="searchInput" placeholder="搜索会员名称...">
</header>

<div class="tabs" id="tabs">
    <div class="tab active" data-cat="all">全部</div>
    <div class="tab" data-cat="视频">📺 视频</div>
    <div class="tab" data-cat="音乐">🎵 音乐</div>
    <div class="tab" data-cat="学习">📚 学习</div>
    <div class="tab" data-cat="生活">🎁 生活</div>
    <div class="tab" data-cat="家政">🧹 家政</div>
</div>

<div class="grid" id="grid"></div>

<div class="footer">
    💬 微信：<span id="footerWechat">你的微信号</span><br>
    长期收各类激活码 · 支持正规充值售后<br>
    价格更新：2026.8.7
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3>🛒 下单确认</h3>
        <div class="qr-placeholder">在此处放置微信收款码</div>
        <p style="font-size: 13px; margin-bottom: 8px;">扫码支付后，添加/联系微信下单</p>
        <div class="order-text" id="orderText" style="background: var(--accent); color: white; font-weight: bold; font-size: 14px; text-align: left; margin-bottom: 8px;">点击购买后自动复制订单信息</div>
        <div style="font-size: 13px; margin-bottom: 4px; color: var(--text-secondary);">请添加微信发送上方信息</div>
        <div class="order-text" style="background: rgba(142,142,147,0.15); color: var(--text); font-weight: bold; font-size: 16px;" id="wechatId">你的微信号</div>
        <button class="buy-btn" style="margin-top:12px; width:100%; padding:10px; background: var(--accent);" onclick="navigator.clipboard.writeText(document.getElementById('orderText').textContent); this.textContent='✅ 已复制！快去发给微信'; setTimeout(()=>this.textContent='复制订单信息', 2000);">复制订单信息</button>
        <a href="weixin://" class="buy-btn" style="display:inline-block; text-decoration:none; width:100%; padding:12px; text-align:center;">打开微信</a>
        <button class="close-modal" id="closeBtn">关闭</button>
    </div>
</div>

const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const tabs = document.querySelectorAll('.tab');
const modalOverlay = document.getElementById('modalOverlay');
const orderText = document.getElementById('orderText');
const closeBtn = document.getElementById('closeBtn');

let currentCat = 'all';
let query = '';

function render() {
    grid.innerHTML = '';
    const filtered = PRODUCTS.filter(p => {
        const matchCat = currentCat === 'all' || p.cat === currentCat;
        const matchSearch = p.name.includes(query) || p.desc.includes(query);
        return matchCat && matchSearch;
    });

    filtered.forEach(p => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
            <span class="cat-tag">${p.cat}</span>
            <div class="name">${p.name}</div>
            <div class="desc">${p.desc}</div>
            <div class="bottom">
                <div class="price">${typeof p.price === 'string' ? p.price : '¥'+p.price}</div>
                <button class="buy-btn" onclick="buy('${p.name}', '${p.desc}', ${typeof p.price === 'string' ? '"' + p.price + '"' : p.price})">购买</button>
            </div>
        `;
        grid.appendChild(el);
    });
}

function buy(name, desc, price) {
    const text = `我要买：${name} ${desc}\n价格：¥${price}\n(请回复你的账号/手机号)`;
    orderText.textContent = text;
    modalOverlay.style.display = 'flex';
}

searchInput.addEventListener('input', e => {
    query = e.target.value;
    render();
});

tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCat = tab.dataset.cat;
        render();
    });
});

closeBtn.addEventListener('click', () => {
    modalOverlay.style.display = 'none';
});

modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) modalOverlay.style.display = 'none';
});

render();
</script>

</html>
